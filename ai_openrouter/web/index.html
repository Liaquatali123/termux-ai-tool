<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Chat - OpenRouter</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --accent2: #1f6feb;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
  --radius: 8px;
  --sidebar-w: 280px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}

.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:16px;font-weight:600;color:var(--text)}
.sidebar-header span{font-size:11px;color:var(--text2)}
.new-chat-btn{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;margin-top:12px;background:var(--accent2);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
.new-chat-btn:hover{background:#388bfd}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{padding:10px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;transition:background .1s;position:relative}
.chat-item:hover{background:var(--surface2)}
.chat-item.active{background:var(--surface2);border-left:3px solid var(--accent)}
.chat-item .title{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.chat-item .meta{font-size:11px;color:var(--text2);margin-top:2px}
.chat-item .del-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text2);cursor:pointer;display:none;font-size:14px;padding:4px 6px;border-radius:4px}
.chat-item:hover .del-btn{display:block}
.chat-item .del-btn:hover{color:var(--red);background:rgba(248,81,73,.15)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text2)}
.sidebar-footer .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sidebar-footer .status-dot.online{background:var(--green)}
.sidebar-footer .status-dot.offline{background:var(--red)}
.sidebar-footer .status-dot.limited{background:var(--orange)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--bg)}
.chat-header .model-info{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.chat-header .model-info .label{color:var(--text2)}
.chat-header .model-info .name{color:var(--accent);font-weight:500}
.chat-header .model-info .badge{font-size:10px;padding:2px 6px;border-radius:10px;background:rgba(88,166,255,.15);color:var(--accent)}
.chat-header .actions{display:flex;gap:8px}
.chat-header .actions select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:4px 8px;font-size:12px;cursor:pointer}
.chat-header .actions select:focus{outline:none;border-color:var(--accent)}

/* Messages */
.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.welcome{text-align:center;margin:auto;max-width:480px;padding:40px 20px}
.welcome h2{font-size:22px;margin-bottom:8px;color:var(--text)}
.welcome p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.welcome .shortcuts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.welcome .shortcuts button{padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s}
.welcome .shortcuts button:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}

.msg{max-width:85%;animation:fadeIn .2s ease}
.msg.user{align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg.system{align-self:center;text-align:center;font-size:12px;color:var(--text2);max-width:100%}
.msg .bubble{padding:12px 16px;border-radius:12px;line-height:1.55;font-size:14px;word-wrap:break-word}
.msg.user .bubble{background:var(--accent2);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.system .bubble{background:transparent;border:none;padding:4px}
.msg .bubble p{margin-bottom:8px}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble pre{background:var(--bg) !important;border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto;margin:8px 0;position:relative;font-size:13px}
.msg .bubble pre code{background:none;padding:0;font-family:'Cascadia Code','Fira Code','JetBrains Mono',monospace}
.msg .bubble code{background:rgba(88,166,255,.12);color:var(--accent);padding:2px 5px;border-radius:4px;font-size:13px;font-family:monospace}
.msg .bubble pre .copy-btn{position:absolute;top:6px;right:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s}
.msg .bubble pre:hover .copy-btn{opacity:1}
.msg .bubble pre .copy-btn:hover{background:var(--accent2);color:#fff}
.msg .bubble ul,.msg .bubble ol{padding-left:20px;margin:6px 0}
.msg .bubble blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--text2);margin:8px 0}
.msg .bubble table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.msg .bubble th,.msg .bubble td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.msg .bubble th{background:var(--surface2);font-weight:600}

/* Typing indicator */
.typing .bubble{display:flex;align-items:center;gap:4px;padding:14px 18px}
.typing .dot{width:7px;height:7px;border-radius:50%;background:var(--text2);animation:bounce 1.4s infinite both}
.typing .dot:nth-child(2){animation-delay:.16s}
.typing .dot:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,80%,100%{transform:scale(0.6)}40%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Input */
.input-area{padding:12px 20px 16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--bg)}
.input-wrapper{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;transition:border-color .15s}
.input-wrapper:focus-within{border-color:var(--accent)}
.input-wrapper textarea{flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;min-height:24px;max-height:200px;line-height:1.5;padding:0}
.input-wrapper textarea::placeholder{color:var(--text2)}
.input-wrapper .send-btn{background:var(--accent2);color:#fff;border:none;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;font-size:16px}
.input-wrapper .send-btn:hover{background:#388bfd}
.input-wrapper .send-btn:disabled{opacity:.4;cursor:not-allowed}
.input-area .hint{font-size:11px;color:var(--text2);margin-top:6px;text-align:center}

/* Config modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:400px;max-width:90vw}
.modal h2{font-size:18px;margin-bottom:16px}
.modal label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px;margin-top:12px}
.modal input,.modal select{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .actions button{padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none}
.modal .actions .primary{background:var(--accent2);color:#fff}
.modal .actions .primary:hover{background:#388bfd}
.modal .actions .secondary{background:var(--surface2);color:var(--text)}
.modal .actions .secondary:hover{background:var(--border)}
.modal .status-text{font-size:12px;color:var(--text2);margin-top:8px}
.modal .status-text.success{color:var(--green)}
.modal .status-text.error{color:var(--red)}

.config-btn{background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:4px;transition:all .15s}
.config-btn:hover{background:var(--surface2);color:var(--text)}

@media(max-width:640px){
  .sidebar{position:fixed;left:-280px;top:0;bottom:0;z-index:100;transition:left .2s}
  .sidebar.open{left:0}
  .sidebar .new-chat-btn{display:flex}
  .main{width:100%}
  .msg{max-width:95%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>AI Chat</h1>
      <span>OpenRouter • Free Models</span>
      <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span><span class="status-dot offline" id="statusDot"></span><span id="statusText">Loading...</span></span>
        <button class="config-btn" onclick="openConfig()" title="Settings">⚙️</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="chat-header">
      <div class="model-info">
        <span class="label">Model:</span>
        <span class="name" id="modelName">openrouter/free</span>
        <span class="badge">auto-failover</span>
      </div>
      <div class="actions">
        <select id="modelSelect" onchange="switchModel(this.value)"></select>
        <button class="config-btn" onclick="openConfig()" title="Settings">⚙️</button>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h2>AI Chat</h2>
        <p>Powered by OpenRouter free models with automatic failover.<br>Start a conversation below.</p>
        <div class="shortcuts">
          <button onclick="sendPrompt('Explain quantum computing in simple terms')">Explain quantum computing</button>
          <button onclick="sendPrompt('Write a Python function to sort a list')">Write Python code</button>
          <button onclick="sendPrompt('Summarize the theory of relativity')">Summarize relativity</button>
          <button onclick="sendPrompt('Help me debug this error: TypeError: undefined is not a function')">Debug code</button>
        </div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrapper">
        <textarea id="chatInput" rows="1" placeholder="Type a message..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
      </div>
      <div class="hint">Enter to send • Shift+Enter for newline</div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="configModal">
  <div class="modal">
    <h2>Settings</h2>
    <label>OpenRouter API Key</label>
    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..."/>
    <label>Model</label>
    <select id="configModelSelect"></select>
    <div class="status-text" id="configStatus"></div>
    <div class="actions">
      <button class="secondary" onclick="closeConfig()">Cancel</button>
      <button class="primary" onclick="saveConfig()">Save</button>
    </div>
  </div>
</div>

<script>
const API = '';
let state = {
  chats: [],
  currentChat: null,
  messages: [],
  streaming: false,
  models: [],
  activeModel: 'openrouter/free',
  apiKey: '',
  abortController: null,
};

async function api(method, path, body) {
  const opts = {method, headers: {'Content-Type': 'application/json'}};
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}

async function loadModels() {
  const d = await api('GET', '/api/models');
  state.models = d.models || [];
  state.activeModel = d.active || 'openrouter/free';
  updateModelUI();
}

async function loadStatus() {
  const d = await api('GET', '/api/status');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (d.api_key_set) {
    dot.className = 'status-dot online';
    txt.textContent = `Online • ${d.model_count || 0} models`;
  } else {
    dot.className = 'status-dot offline';
    txt.textContent = 'No API key';
  }
}

async function loadHistory() {
  const d = await api('GET', '/api/history');
  state.chats = d || [];
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('chatList');
  if (state.chats.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2);font-size:13px">No chats yet</div>';
    return;
  }
  list.innerHTML = state.chats.map(c => `
    <div class="chat-item ${state.currentChat === c.id ? 'active' : ''}" onclick="switchChat('${c.id}')">
      <div class="title">${esc(c.title || 'New Chat')}</div>
      <div class="meta">${c.model || ''} • ${new Date(c.timestamp).toLocaleDateString()}</div>
      <button class="del-btn" onclick="event.stopPropagation();deleteChat('${c.id}')">✕</button>
    </div>
  `).join('');
}

function updateModelUI() {
  const sel = document.getElementById('modelSelect');
  const name = document.getElementById('modelName');
  const cfgSel = document.getElementById('configModelSelect');
  const all = [...new Set([state.activeModel, ...state.models, 'openrouter/free'])];
  const opts = all.map(m => `<option value="${m}" ${m === state.activeModel ? 'selected':''}>${m}</option>`).join('');
  sel.innerHTML = opts;
  cfgSel.innerHTML = opts;
  name.textContent = state.activeModel;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderMarkdown(text) {
  if (!text) return '';
  try {
    return marked.parse(text, {breaks: true, gfm: true});
  } catch (e) {
    return esc(text);
  }
}

function appendMessage(role, content, isStreaming) {
  const el = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  let msgEl = document.querySelector('.msg.streaming');
  if (isStreaming && msgEl) {
    const bubble = msgEl.querySelector('.bubble');
    bubble.innerHTML = renderMarkdown(content);
    bubble.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    return msgEl;
  }

  if (!isStreaming) {
    const existing = document.querySelector('.msg.streaming');
    if (existing) existing.classList.remove('streaming');
  }

  const div = document.createElement('div');
  div.className = `msg ${role}${isStreaming ? ' streaming' : ''}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'assistant' && !isStreaming) {
    bubble.innerHTML = renderMarkdown(content);
    bubble.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
    bubble.querySelectorAll('pre').forEach(pre => {
      if (!pre.querySelector('.copy-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = () => {
          navigator.clipboard.writeText(pre.textContent.replace('Copy', ''));
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 2000);
        };
        pre.appendChild(btn);
      }
    });
  } else if (isStreaming) {
    bubble.innerHTML = renderMarkdown(content);
  } else {
    bubble.textContent = content;
  }

  div.appendChild(bubble);
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

function showTyping() {
  const el = document.getElementById('messages');
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.style.display = 'none';

  const div = document.createElement('div');
  div.className = 'msg assistant typing';
  div.id = 'typingIndicator';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  div.appendChild(bubble);
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
  document.getElementById('sendBtn').disabled = !ta.value.trim() || state.streaming;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendPrompt(text) {
  document.getElementById('chatInput').value = text;
  autoResize(document.getElementById('chatInput'));
  sendMessage();
}

async function newChat() {
  state.currentChat = `chat_${Date.now()}`;
  state.messages = [];
  document.getElementById('messages').innerHTML = `
    <div class="welcome" id="welcome">
      <h2>AI Chat</h2>
      <p>Powered by OpenRouter free models with automatic failover.<br>Start a conversation below.</p>
      <div class="shortcuts">
        <button onclick="sendPrompt('Explain quantum computing in simple terms')">Explain quantum computing</button>
        <button onclick="sendPrompt('Write a Python function to sort a list')">Write Python code</button>
        <button onclick="sendPrompt('Summarize the theory of relativity')">Summarize relativity</button>
        <button onclick="sendPrompt('Help me debug this error: TypeError: undefined is not a function')">Debug code</button>
      </div>
    </div>`;
  renderSidebar();
  document.getElementById('chatInput').focus();
}

async function switchChat(id) {
  if (state.streaming && state.abortController) {
    state.abortController.abort();
    state.streaming = false;
  }
  state.currentChat = id;
  const d = await api('GET', '/api/history');
  const chat = d.find(c => c.id === id);
  if (chat) {
    const detail = await api('POST', '/api/history', {id, messages: []});
    state.messages = chat.messages || [];
  } else {
    state.messages = [];
  }
  renderSidebar();
  renderMessages();
}

function renderMessages() {
  const el = document.getElementById('messages');
  el.innerHTML = '';
  if (state.messages.length === 0) {
    el.innerHTML = `<div class="welcome" id="welcome">
      <h2>AI Chat</h2>
      <p>Powered by OpenRouter free models with automatic failover.<br>Start a conversation below.</p>
      <div class="shortcuts">
        <button onclick="sendPrompt('Explain quantum computing in simple terms')">Explain quantum computing</button>
        <button onclick="sendPrompt('Write a Python function to sort a list')">Write Python code</button>
        <button onclick="sendPrompt('Summarize the theory of relativity')">Summarize relativity</button>
        <button onclick="sendPrompt('Help me debug this error: TypeError: undefined is not a function')">Debug code</button>
      </div>
    </div>`;
    return;
  }
  for (const m of state.messages) {
    appendMessage(m.role, typeof m.content === 'string' ? m.content : '', false);
  }
}

async function deleteChat(id) {
  await api('DELETE', `/api/history/${id}`);
  if (state.currentChat === id) newChat();
  await loadHistory();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || state.streaming) return;

  input.value = '';
  autoResize(input);
  document.getElementById('sendBtn').disabled = true;

  if (!state.currentChat) {
    state.currentChat = `chat_${Date.now()}`;
    state.messages = [];
  }

  state.messages.push({role: 'user', content: text});
  appendMessage('user', text, false);

  showTyping();
  state.streaming = true;

  const abortController = new AbortController();
  state.abortController = abortController;

  let fullResponse = '';
  let usedModel = state.activeModel;

  try {
    const resp = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: state.messages, key: state.apiKey || undefined}),
      signal: abortController.signal,
    });

    if (!resp.ok) {
      const err = await resp.json();
      removeTyping();
      appendMessage('system', `Error: ${err.error || resp.statusText}`, false);
      state.streaming = false;
      document.getElementById('sendBtn').disabled = false;
      return;
    }

    removeTyping();
    appendMessage('assistant', '', true);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'meta') {
              usedModel = data.model || usedModel;
            } else if (data.type === 'chunk') {
              fullResponse += data.content || '';
              appendMessage('assistant', fullResponse, true);
            } else if (data.type === 'done') {
              fullResponse = data.content || fullResponse;
              usedModel = data.model || usedModel;
            } else if (data.type === 'error') {
              const el = document.querySelector('.msg.streaming');
              if (el) {
                el.querySelector('.bubble').innerHTML = `<span style="color:var(--red)">Error: ${data.error}</span>`;
                el.classList.remove('streaming');
              } else {
                appendMessage('system', `Error: ${data.error}`, false);
              }
            }
          } catch (e) {}
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      removeTyping();
    } else {
      removeTyping();
      appendMessage('system', `Connection error`, false);
    }
  }

  state.streaming = false;

  if (fullResponse) {
    const finalEl = document.querySelector('.msg.streaming');
    if (finalEl) {
      finalEl.classList.remove('streaming');
      const bubble = finalEl.querySelector('.bubble');
      bubble.innerHTML = renderMarkdown(fullResponse);
      bubble.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
      bubble.querySelectorAll('pre').forEach(pre => {
        if (!pre.querySelector('.copy-btn')) {
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.onclick = () => {
            navigator.clipboard.writeText(pre.textContent.replace('Copy', ''));
            btn.textContent = 'Copied!';
            setTimeout(() => btn.textContent = 'Copy', 2000);
          };
          pre.appendChild(btn);
        }
      });
    }
    state.messages.push({role: 'assistant', content: fullResponse});
    state.activeModel = usedModel;
    updateModelUI();

    await api('POST', '/api/history', {
      id: state.currentChat,
      model: usedModel,
      messages: state.messages,
    });
    await loadHistory();
    renderSidebar();
  }

  document.getElementById('sendBtn').disabled = false;
  document.getElementById('chatInput').focus();
}

function switchModel(model) {
  state.activeModel = model;
  updateModelUI();
}

function openConfig() {
  document.getElementById('configModal').classList.add('active');
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('configStatus').textContent = '';
}

function closeConfig() {
  document.getElementById('configModal').classList.remove('active');
}

async function saveConfig() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const model = document.getElementById('configModelSelect').value;
  const status = document.getElementById('configStatus');

  if (key) {
    const r = await api('POST', '/api/key', {key});
    if (r.saved) {
      state.apiKey = key;
      status.textContent = '✅ API key saved';
      status.className = 'status-text success';
      loadStatus();
    } else {
      status.textContent = '❌ Failed to save key';
      status.className = 'status-text error';
    }
  }
  if (model) {
    state.activeModel = model;
    updateModelUI();
  }
  setTimeout(closeConfig, 1000);
}

// Init
(async function init() {
  const status = await api('GET', '/api/status');
  if (status.api_key_set) {
    state.apiKey = 'loaded';
  }
  await loadModels();
  await loadHistory();
  await loadStatus();
  document.getElementById('chatInput').focus();
})();
</script>
</body>
</html>
